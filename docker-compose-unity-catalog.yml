# Unity Catalog OSS v0.5.0 — the catalog for this stack.
#
# Provides:
# - REST API for Iceberg tables (read-only via Iceberg REST, full CRUD via UC API)
# - Catalog-managed Delta tables (delta.feature.catalogManaged) under a catalog storage_root
# - Credential vending via external locations
# - Storage credentials API (AWS IAM role support)
# - Multi-format support (Delta, Iceberg via UniForm)
# - Interoperability with DuckDB, Trino, Dremio, Polars, etc.
# - Authorization framework (OAuth + grants)
# - Managed storage locations for catalogs/schemas
#
# Usage:
#   docker compose -f docker-compose-unity-catalog.yml up -d
#
# Then configure Spark to use the Unity Catalog REST endpoint. Spark runs on the
# bridge, so it uses the in-network service name (host 8081 -> container 8080):
#   spark.sql.catalog.iceberg.uri = http://unity-catalog:8080/api/2.1/unity-catalog/iceberg
# (From the host, the same endpoint is http://localhost:8081/api/2.1/unity-catalog/iceberg.)
#
# Capabilities relied on here:
#   - Catalog-managed Delta: a catalog with a storage_root assigns table locations,
#     so SQL `.sql` SDP transformations materialize without an explicit LOCATION
#     (see demos/sdp-medallion and .claude/skills/sdp/unity-catalog.md)
#   - External locations API: POST /api/2.1/unity-catalog/external-locations
#   - Storage credentials API: POST /api/2.1/unity-catalog/credentials
#   - Managed storage on catalogs/schemas (storage_root parameter)
#   - Iceberg writes are NOT supported on any UC OSS build (0.4.x and 0.5.0
#     alike reject data_source_format=ICEBERG) — this catalog is Delta-write /
#     Iceberg-read-only (see CLAUDE.md, §1.12).

services:
  unity-catalog:
    # Official, canonical UC image (PR #13 / T-1.17, D2). Replaced the earlier
    # personal pre-publish staging artifact (a personal Docker Hub namespace with
    # one v0.4.1 tag and no retention guarantee) with the canonical, versioned,
    # retained release. The v0.5.0 win is catalog-managed
    # Delta (delta.feature.catalogManaged), which unlocks SQL `.sql` SDP
    # transformations. It adds NO Iceberg write support — 0.4.x and 0.5.0 both
    # reject data_source_format=ICEBERG (measured, §1.12), so this catalog stays
    # Delta-write / Iceberg-read-only (see CLAUDE.md). v0.5.1 is released on
    # GitHub but has no official container yet — do not bump past 0.5.0.
    image: unitycatalog/unitycatalog:v0.5.0
    container_name: unity-catalog
    ports:
      - "8081:8080"      # REST API + Iceberg REST Catalog endpoint (8081 host, SeaweedFS uses 8080)
    environment:
      - JAVA_OPTS=-Xmx2g
    volumes:
      #- ./config/unity-catalog:/opt/unitycatalog/etc/conf
      - type: bind
        source: ./config/unity-catalog/server.properties
        target: /home/unitycatalog/etc/conf/server.properties
      # uc-data mounted (PR #13 / T-1.20b): persists UC's embedded H2 store to a
      # named volume so backup/restore can cover it via the volume rather than a
      # docker cp of an ephemeral container layer. UC stays on embedded H2 — this
      # only makes that state durable; it does NOT point UC at PostgreSQL.
      - uc-data:/home/unitycatalog/etc/db
      - uc-logs:/home/unitycatalog/etc/logs
    healthcheck:
      # The image ships busybox wget, NOT curl — a curl-based check can never pass and
      # leaves UC perpetually "unhealthy" (also hanging any depends_on: service_healthy).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/2.1/unity-catalog/catalogs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - lakehouse-network

  # Optional: Unity Catalog Web UI
  # Uncomment to enable the graphical interface
  # unity-catalog-ui:
  #   image: unitycatalog/unitycatalog-ui:0.4.0
  #   container_name: unity-catalog-ui
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - UC_API_URL=http://unity-catalog:8080
  #   depends_on:
  #     unity-catalog:
  #       condition: service_healthy
  #   networks:
  #     - lakehouse-network

volumes:
  uc-data:
    driver: local
  uc-logs:
    driver: local

networks:
  lakehouse-network:
    driver: bridge
