# Kafka 3.5 + Zookeeper on the shared lakehouse-network bridge (PR #13 / T-1.4).
#
# Dual advertised listeners so both worlds work:
#   INTERNAL  kafka:9092       — in-network clients (Spark, Airflow) on the bridge
#   EXTERNAL  localhost:9092   — host clients (producers, tests) via the published port
# The external listener lives on container port 19092 and is published to host
# 9092, so a host client that connects to localhost:9092 is handed back
# localhost:9092 as the advertised address; in-network clients get kafka:9092.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.admin.serverPort=9999"
    networks:
      - lakehouse-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:19092"   # host localhost:9092 -> EXTERNAL listener (container 19092)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - lakehouse-network

networks:
  lakehouse-network:
    driver: bridge
