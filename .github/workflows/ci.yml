name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default permissions: read-only. Individual jobs can request more via their
# own `permissions:` block if they truly need write access.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry==2.1.0

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff
        run: poetry run ruff check scripts/ tests/ demos/

      - name: Black
        run: poetry run black --check scripts/ tests/ demos/

      - name: ShellCheck on lakehouse CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          # informational only — the CLI has known SC2086 word-split warnings
          shellcheck -S warning lakehouse || true

      - name: Bash syntax check
        run: bash -n lakehouse

      - name: Version-consistency gate (T0)
        # Pins are tested claims, not comments (docs/testing.md). Fails the build
        # if the core jar versions in download-jars.sh / spark-defaults.conf.example
        # / CLAUDE.md disagree, or a forbidden version / JDBC-catalog path leaked
        # into shipped config. No Docker, no network.
        run: bash scripts/tools/verify-versions.sh --tracked-only

      - name: Validate compose files
        run: |
          for f in docker-compose-*.yml; do
            docker compose -f "$f" config -q && echo "✓ $f"
          done

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pipx install poetry==2.1.0

      - run: poetry install --with dev,test

      - name: pytest (unit only, no docker)
        run: poetry run pytest tests/ --ignore=tests/integration -v

  spark-image-pull:
    name: Verify Spark 4.1 image pulls
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - name: Pull and check Spark 4.1
        run: |
          docker pull apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu
          docker run --rm apache/spark:4.1.0-scala2.13-java21-python3-r-ubuntu \
            /opt/spark/bin/spark-submit --version 2>&1 | grep -E "version [0-9]"
          echo "Spark 4.1 image OK"

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pipx install poetry==2.1.0

      - run: poetry install --with dev,test

      - name: pytest -m security
        run: poetry run pytest -m security -v

  supply-chain:
    name: SBOM & supply-chain
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5

      # SBOM of the whole repo (Python deps via poetry.lock, plus any pinned
      # jars/lockfiles present) — an inventory to diff release-over-release and
      # feed to vuln scanners. docs/testing.md — supply chain.
      - name: Generate SBOM (SPDX-JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json

      - name: Vulnerability scan (informational)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          sbom: sbom.spdx.json
          fail-build: false
          severity-cutoff: high
          output-format: table

      # Warn (not fail) until scripts/tools/images.lock is generated on a
      # networked machine. Flip to --strict here once it is populated.
      - name: Container image digest-lock coverage
        run: bash scripts/tools/pin-images.sh --check

      # Same story for the jar sha256 lock: coverage is warn-only until
      # jars.sha256 is populated (./scripts/tools/download-jars.sh --lock), then
      # add --require-checksums to enforce.
      - name: JAR sha256 lock coverage
        run: bash scripts/tools/verify-versions.sh --tracked-only
