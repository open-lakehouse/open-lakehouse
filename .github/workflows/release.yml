name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          # Random heredoc delimiter: a commit subject could otherwise contain a
          # literal "EOF" line and prematurely terminate (or inject into) the
          # multiline output. See GitHub's multiline-output guidance.
          DELIM="ghadelimiter_$(openssl rand -hex 16)"
          {
            echo "notes<<${DELIM}"
            if [ -z "$PREV_TAG" ]; then
              echo "## Initial Release"
              echo ""
              echo "First stable release of open-lakehouse."
            else
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s"
              echo ""
            fi
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
