name: Version matrix (T4)

# The version-change gate (Tier 4 in docs/testing.md). A pin bump is the highest-
# risk change in this repo, so it is not enough to show the NEW version works —
# we also prove the KNOWN-BAD versions still fail the exact way the pin's
# rationale says they do. If a "bad" version starts passing, the rationale is
# stale and a human must reconcile docs/testing.md before the pin can move.
#
# Delta is the canonical case: 4.3.1 is the pin, and 4.2.0 cannot do
# catalog-managed Delta through the UC 0.5.x connector. Each leg swaps its Delta
# onto the live classpath, brings up Spark + Unity Catalog, and runs two gates:
#   I-02  path-based Delta write/append/read/time-travel (the stack is healthy)
#   I-45  catalog-managed Delta through UCSingleCatalog (what the pin protects)
# A "pass" leg must pass both. A "fail" leg must pass I-02 and fail I-45 with
# the measured signature, so it cannot go green by failing for an unrelated
# reason. A skipped or missing gate is red on every leg.
#
# Calibrated on the Ubuntu 26.04 runner (2026-10-26), with each leg confirmed to
# load its own delta-spark/delta-storage jars: 4.3.1 passes both; 4.2.0 fails
# I-45 with UC's `400 INVALID_ARGUMENT ... Invalid type_json`. Delta 4.3.0 was
# recorded as NPE-ing through the UC connector, but on this jar set it passes
# I-45 and every other UC gate (I-44, I-42, I-47), so it is no longer a leg.

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tools/download-jars.sh'
      - 'config/spark/spark-defaults.conf.example'
      - 'CLAUDE.md'
      - 'docs/testing.md'
      - 'docs/compatibility.md'
      - '.github/workflows/version-matrix.yml'
  workflow_dispatch:

concurrency:
  group: version-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast static fail on the tracked tree before any Docker work. --tracked-only so
  # the (intentionally forbidden) live-conf swap the matrix does below is not what
  # this checks — it gates the committed files only.
  preflight:
    name: Preflight (T0 static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/tools/verify-versions.sh --tracked-only

  delta-abi-matrix:
    name: Delta ${{ matrix.delta }} — expect ${{ matrix.expect }}
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - delta: "4.3.1"   # the pin — must PASS
            expect: pass
            signature: ""
          - delta: "4.2.0"   # no catalog-managed Delta — I-45 must FAIL this way
            expect: fail
            signature: "Invalid type_json"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pipx install --python "$(command -v python)" poetry==2.1.0
      - run: poetry install --with dev,test

      - name: Prepare env (.env + configs from examples)
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_USER=lakehouse"
            echo "POSTGRES_PASSWORD=lakehouse_test_pw"
            echo "S3_BUCKET=lakehouse"
            echo "S3_WAREHOUSE=s3a://lakehouse/warehouse"
          } >> .env
          cp config/spark/spark-defaults.conf.example config/spark/spark-defaults.conf
          # Align spark-defaults S3 creds with .env — setup's credential-consistency
          # check is fatal on the placeholder key / on a mismatch vs .env.
          sed -i "s|your_access_key|lakehouse_s3|; s|your_secret_key|lakehouse_s3_secret|" \
            config/spark/spark-defaults.conf

      - name: Start storage FIRST (PostgreSQL + SeaweedFS)
        # setup runs setup_postgres (needs PG up) — storage must precede it.
        run: ./lakehouse start storage

      - name: Setup (download the pinned/good JAR set, init PG DBs)
        run: ./lakehouse setup

      - name: Swap Delta onto the live classpath
        run: bash scripts/tools/swap-delta-version.sh "${{ matrix.delta }}"

      - name: Bring up Spark (reads the swapped live conf — storage already up)
        run: ./lakehouse start all

      - name: Bring up Unity Catalog (I-45 runs through it)
        run: ./lakehouse start unity-catalog

      - name: Readiness gate (spark-master must be up — a down master is a failure)
        run: |
          set -e
          ./lakehouse status --json | tee status.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("status.json"))
          if not s.get("spark", {}).get("master"):
              print(f"::error::spark-master not running; cannot evaluate Delta ABI: {s}")
              sys.exit(1)
          print("spark-master up — evaluating Delta ABI.")
          PY

      - name: Run the Delta gates, assert outcome matches expectation
        env:
          DELTA: ${{ matrix.delta }}
          EXPECT: ${{ matrix.expect }}
          SIGNATURE: ${{ matrix.signature }}
        run: |
          set +e
          poetry run pytest \
            tests/integration/test_delta_version.py::test_i02_delta_write_read_timetravel \
            "tests/integration/sdp/test_sdp_table_formats.py::TestI45CatalogManagedDelta::test_i45_catalog_managed_delta_no_location" \
            -q --no-header -rA --junitxml=matrix-report.xml
          set -e
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET

          delta, expect, sig = os.environ["DELTA"], os.environ["EXPECT"], os.environ["SIGNATURE"]
          GATES = {"test_i02_delta_write_read_timetravel": "I-02",
                   "test_i45_catalog_managed_delta_no_location": "I-45"}
          try:
              root = ET.parse("matrix-report.xml").getroot()
          except FileNotFoundError:
              print("::error::no matrix-report.xml; the gates did not run"); sys.exit(1)
          res = {}
          for tc in root.iter("testcase"):
              gate = GATES.get(tc.get("name"))
              if not gate:
                  continue
              outcome, text = "passed", ""
              for child in tc:
                  if child.tag in ("failure", "error", "skipped"):
                      outcome = "failed" if child.tag == "failure" else child.tag
                      text = (child.get("message") or "") + "\n" + (child.text or "")
              res[gate] = (outcome, text)
          for gate in GATES.values():
              print(f"Delta {delta}: {gate} {res.get(gate, ('missing',))[0]}")

          bad = [g for g in GATES.values() if res.get(g, ("missing",))[0] in ("missing", "skipped", "error")]
          if bad:
              print(f"::error::Delta {delta}: gate(s) {bad} did not run to a verdict; a skip is a failure here"); sys.exit(1)
          if res["I-02"][0] != "passed":
              print(f"::error::Delta {delta}: path-based Delta (I-02) failed, so this leg says nothing about the pin"); sys.exit(1)
          i45, text = res["I-45"]
          if expect == "pass":
              if i45 != "passed":
                  print(f"::error::Delta {delta} was expected to PASS catalog-managed Delta (I-45) but failed. The pin may be broken."); sys.exit(1)
              print(f"Delta {delta} passed I-02 and I-45: good pin verified end to end.")
          else:
              if i45 == "passed":
                  print(f"::error::Delta {delta} was expected to FAIL catalog-managed Delta (I-45) but PASSED. The pin rationale is STALE; reconcile docs/testing.md and docs/compatibility.md before moving the pin."); sys.exit(1)
              if sig not in text:
                  print(f"::error::Delta {delta} failed I-45, but not with the recorded signature {sig!r}. It failed for a different reason; re-measure before trusting this gate."); sys.exit(1)
              print(f"Delta {delta} failed I-45 with {sig!r} as recorded: negative gate holds.")
          PY

      - name: Teardown (safe stop — never down -v)
        if: always()
        run: |
          ./lakehouse stop all || true
          ./lakehouse stop storage || true
