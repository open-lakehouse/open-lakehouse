# OpenSharing Server Configuration
# Based on: https://github.com/delta-io/delta-sharing

# The format version of this config file
version: 1

# Config shares/schemas/tables to share.
# NOTE: Only list tables that have valid Delta logs in SeaweedFS. Tables without
# data cause 400/500 errors and break clients (e.g. Databricks Catalog Explorer).
# These two are written by the self-contained sharing seed
# (scripts/sharing/seed_shared_tables.py) to fixed s3a:// prefixes, so the share
# is verifiable in isolation and does not depend on any demo having run first.
shares:
- name: "lakehouse_share"
  schemas:
  - name: "retail"
    tables:
    - name: "sales_by_region"
      location: "s3a://lakehouse/warehouse/sharing/sales_by_region/"
      id: "00000000-0000-0000-0000-000000000010"
    - name: "daily_revenue"
      location: "s3a://lakehouse/warehouse/sharing/daily_revenue/"
      id: "00000000-0000-0000-0000-000000000011"

# Authorization - bearer tokens for recipients
authorization:
  bearerToken: "__DELTA_SHARING_TOKEN__"

# Set the host name that the server will use
host: "0.0.0.0"

# Set the port that the server will listen on
port: 8443

# Set the url prefix for the REST APIs
endpoint: "/delta-sharing"

# Set the timeout of S3 presigned url in seconds
preSignedUrlTimeoutSeconds: 3600

# Hadoop/S3 storage configuration for SeaweedFS
# Reference: https://github.com/delta-io/delta-sharing
hadoopConf:
  "fs.s3a.endpoint": "http://seaweedfs:8333"
  "fs.s3a.access.key": "__S3_ACCESS_KEY__"
  "fs.s3a.secret.key": "__S3_SECRET_KEY__"
  "fs.s3a.path.style.access": "true"
  "fs.s3a.connection.ssl.enabled": "false"
  "fs.s3a.endpoint.region": "us-east-1"
  "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
  "fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
  "fs.s3a.change.detection.mode": "none"
  "fs.s3a.signing-algorithm": "AWSS3V4SignerType"
  "fs.s3a.metadatastore.impl": "org.apache.hadoop.fs.s3a.impl.NullMetadataStore"
  "fs.s3a.directory.marker.retention": "keep"

# How many tables to cache in the server
deltaTableCacheSize: 10

# Whether we can accept working with a stale version of the table
stalenessAcceptable: false

# Whether to evaluate user provided `predicateHints`
evaluatePredicateHints: false

# Whether to evaluate user provided `jsonPredicateHints`
evaluateJsonPredicateHints: true

# Whether to evaluate user provided `jsonPredicateHints` for V2 predicates
evaluateJsonPredicateHintsV2: true

# The maximum page size permitted by queryTable/queryTableChanges API
queryTablePageSizeLimit: 10000

# The TTL of the page token generated in queryTable/queryTableChanges API (in milliseconds)
queryTablePageTokenTtlMs: 259200000

# The TTL of the refresh token generated in queryTable API (in milliseconds)
refreshTokenTtlMs: 3600000

# SSL configuration
ssl:
  selfSigned: true
  certificateFile: "/opt/delta-sharing/certs/server.crt"
  certificateKeyFile: "/opt/delta-sharing/certs/server.key"
