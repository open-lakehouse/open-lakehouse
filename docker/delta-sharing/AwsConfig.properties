# AWS SDK v1 Configuration for SeaweedFS
# This file configures the AWS SDK to use a custom S3 endpoint for pre-signed URL generation

# S3 Service Endpoint Configuration
# The endpoint URL for S3 operations (set at runtime via environment variable)
s3.endpoint=${AWS_S3_ENDPOINT}

# Enable Signature Version 4 (required for SeaweedFS)
s3.signer=AWSS3V4SignerType

# Disable certificate validation (for self-signed certs in dev)
com.amazonaws.sdk.disableCertChecking=true

# Use path-style access (required for SeaweedFS)
# Format: https://endpoint/bucket/key instead of https://bucket.endpoint/key
s3.pathStyleAccess=true

# Region configuration
s3.region=us-east-1
